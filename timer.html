<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⏱️ Countdown Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Nunito',sans-serif;color:#e8eef8;
  background:#0a0f1c;
  background-image:
    radial-gradient(800px 420px at 50% -8%, rgba(56,189,248,.18), transparent 62%),
    radial-gradient(700px 420px at 50% 108%, rgba(16,185,129,.12), transparent 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:16px;transition:background-color .25s;
}
body.warn{background-color:#2a0f14;}
body.flash{animation:flashbg .55s ease-out 3;}
@keyframes flashbg{0%,100%{background-color:#0a0f1c;}50%{background-color:#3b0a12;}}

h1{font-size:clamp(1rem,3.4vw,1.25rem);font-weight:900;letter-spacing:.5px;}

/* scoreboard */
.score{display:flex;gap:12px;width:min(94vw,440px);}
.team{
  flex:1;border-radius:18px;padding:11px 10px 10px;text-align:center;
  background:rgba(255,255,255,.05);border:2px solid var(--c);
  transition:box-shadow .3s;
}
.team.lead{box-shadow:0 0 26px var(--glow);}
.team .nm{
  font-size:.72rem;font-weight:900;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--c);
}
.team .pts{
  font-size:clamp(2.3rem,11vw,3.2rem);font-weight:900;line-height:1.05;
  font-variant-numeric:tabular-nums;color:var(--c);
}
.team .pts.bump{animation:bump .42s cubic-bezier(.34,1.56,.64,1);}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.team .row{display:flex;gap:6px;justify-content:center;margin-top:3px;}
.plus{
  font-family:inherit;font-weight:900;cursor:pointer;border:none;border-radius:30px;
  padding:7px 22px;font-size:.95rem;background:var(--c);color:var(--ink);
  transition:transform .08s;
}
.plus:active{transform:translateY(2px) scale(.96);}
.minus{
  font-family:inherit;font-weight:900;cursor:pointer;border-radius:30px;
  padding:7px 13px;font-size:.9rem;background:transparent;
  border:2px solid rgba(255,255,255,.18);color:#8ba0bf;transition:transform .08s;
}
.minus:active{transform:translateY(2px) scale(.96);}
#strong{--c:#f472b6;--glow:rgba(244,114,182,.5);--ink:#3b0a24;}
#smart {--c:#f1f5f9;--glow:rgba(241,245,249,.38);--ink:#0f172a;}
.zerobtn{
  font-family:inherit;font-weight:800;cursor:pointer;font-size:.72rem;
  background:transparent;border:1px solid rgba(255,255,255,.15);color:#7f93b4;
  border-radius:30px;padding:5px 15px;
}
.zerobtn:active{background:rgba(255,255,255,.07);}

/* preset choice */
.opts{display:flex;gap:10px;}
.opt{
  font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;
  padding:11px 26px;border-radius:40px;color:#cfe0f5;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
  transition:transform .08s,background .15s,border-color .15s,color .15s;
}
.opt:active{transform:scale(.95);}
.opt.sel{background:#0ea5e9;border-color:#7dd3fc;color:#fff;box-shadow:0 0 22px rgba(14,165,233,.45);}

/* dial */
.dial{position:relative;width:min(64vw,240px);aspect-ratio:1;}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);}
.track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:14;}
.prog{fill:none;stroke:#22c55e;stroke-width:14;stroke-linecap:round;
      transition:stroke .3s;}
.readout{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
#num{
  font-size:clamp(3.4rem,17vw,5.6rem);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;transition:color .2s;
}
#num.warn{color:#f87171;}
#num.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.32);}100%{transform:scale(1);}}
#sub{font-size:.78rem;color:#8ba0bf;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
#sub.done{color:#f87171;letter-spacing:3px;}

/* controls */
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{
  font-family:inherit;font-weight:900;border:none;border-radius:40px;cursor:pointer;
  padding:13px 34px;font-size:1.05rem;color:#fff;
  background:#16a34a;box-shadow:0 5px 0 #14532d;transition:transform .08s,box-shadow .08s,opacity .15s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #14532d;}
.btn.grey{background:#475569;box-shadow:0 5px 0 #27303f;}
.btn.grey:active{box-shadow:0 1px 0 #27303f;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

.hint{font-size:.72rem;color:#64748b;text-align:center;}
</style>
</head>
<body>

<div class="score">
  <div class="team" id="strong">
    <div class="nm">Team Strong</div>
    <div class="pts" id="pStrong">0</div>
    <div class="row">
      <button class="plus"  data-t="strong" data-d="1">+1</button>
      <button class="minus" data-t="strong" data-d="-1">−</button>
    </div>
  </div>
  <div class="team" id="smart">
    <div class="nm">Team Smart</div>
    <div class="pts" id="pSmart">0</div>
    <div class="row">
      <button class="plus"  data-t="smart" data-d="1">+1</button>
      <button class="minus" data-t="smart" data-d="-1">−</button>
    </div>
  </div>
</div>
<button class="zerobtn" id="zero">↺ 重置比分 Reset scores</button>

<h1>⏱️ Countdown Timer</h1>

<div class="opts">
  <button class="opt sel" id="o30" data-sec="30">30 sec</button>
  <button class="opt"     id="o60" data-sec="60">60 sec</button>
</div>

<div class="dial">
  <svg viewBox="0 0 220 220">
    <circle class="track" cx="110" cy="110" r="96"></circle>
    <circle class="prog"  cx="110" cy="110" r="96" id="ring"></circle>
  </svg>
  <div class="readout">
    <div id="num">30</div>
    <div id="sub">seconds</div>
  </div>
</div>

<div class="ctrls">
  <button class="btn" id="go">▶ Start</button>
  <button class="btn grey" id="rst">↺ Reset</button>
</div>

<div class="hint">Beeps for the final 5 seconds · Space = start/pause · R = reset</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const ring = $('ring'), num = $('num'), sub = $('sub');
const CIRC = 2 * Math.PI * 96;
ring.style.strokeDasharray = CIRC;

let duration = 30;      // chosen preset, seconds
let remain   = 30;      // seconds left (authoritative when paused)
let endAt    = 0;       // wall-clock deadline while running
let running  = false;
let finished = false;
let lastBeep = null;    // last whole second we beeped on, so we never double-beep

// ── sound ──────────────────────────────────────────────────
let ac = null;
function audio(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function beep(freq, dur, vol, type){
  try{
    const c = audio();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    const t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const tick  = n => beep(n === 1 ? 1050 : 760, .16, .22);     // last 5s, higher on the final one
const buzz  = () => [0, .22, .44].forEach((d, i) =>
                setTimeout(() => beep(i === 2 ? 520 : 680, .34, .26, 'sawtooth'), d * 1000));

// ── render ─────────────────────────────────────────────────
function paint(secsLeft){
  const shown = Math.max(0, Math.ceil(secsLeft - 1e-6));
  if (num.textContent !== String(shown)) num.textContent = shown;

  const frac = duration ? Math.max(0, secsLeft) / duration : 0;
  ring.style.strokeDashoffset = CIRC * (1 - frac);

  const warn = secsLeft <= 5 + 1e-6 && secsLeft > 0;
  ring.style.stroke = finished ? '#ef4444'
                    : warn     ? '#ef4444'
                    : secsLeft <= 10 ? '#f59e0b' : '#22c55e';
  num.classList.toggle('warn', warn || finished);
  document.body.classList.toggle('warn', warn);
}

function setSub(txt, done){
  sub.textContent = txt;
  sub.classList.toggle('done', !!done);
}

// ── loop ───────────────────────────────────────────────────
function frame(){
  if (running){
    // Derive from a wall-clock deadline rather than counting down a variable:
    // intervals drift and background tabs throttle them, which would desync
    // both the digits and the final-5 beeps.
    const left = (endAt - Date.now()) / 1000;
    remain = Math.max(0, left);
    paint(remain);                       // repaint first...

    const whole = Math.ceil(remain - 1e-6);
    if (remain > 0 && whole <= 5 && whole !== lastBeep){
      lastBeep = whole;
      tick(whole);                       // ...so the beep lands on the number shown
      num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    }
    if (remain <= 0) finish();
  } else {
    paint(remain);
  }
  requestAnimationFrame(frame);
}

function finish(){
  running = false; finished = true; remain = 0;
  lastBeep = null;
  buzz();
  $('go').textContent = '▶ Start';
  $('go').disabled = true;
  setSub("time's up!", true);
  document.body.classList.remove('warn');
  document.body.classList.add('flash');
  setTimeout(() => document.body.classList.remove('flash'), 1800);
}

function start(){
  if (running || remain <= 0) return;
  audio();                       // the click is the gesture that unlocks audio
  finished = false;
  running = true;
  endAt = Date.now() + remain * 1000;
  // lastBeep deliberately survives pause/resume: the second we are already
  // inside has had its beep, and re-arming it here played it twice.
  $('go').textContent = '⏸ Pause';
  setSub('counting down');
}
function pause(){
  if (!running) return;
  remain = Math.max(0, (endAt - Date.now()) / 1000);
  running = false;
  $('go').textContent = '▶ Start';
  setSub('paused');
}
function reset(){
  running = false; finished = false;
  remain = duration;
  lastBeep = null;
  $('go').textContent = '▶ Start';
  $('go').disabled = false;
  setSub('seconds');
  document.body.classList.remove('warn', 'flash');
  paint(remain);
}
function choose(sec){
  duration = sec;
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.sec === sec));
  reset();
}

$('go').onclick  = () => running ? pause() : start();
$('rst').onclick = reset;
document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.sec));
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); running ? pause() : start(); }
  else if (e.key === 'r' || e.key === 'R'){ reset(); }
});

// ── scoreboard ─────────────────────────────────────────────
const KEY = 'teamScores.v1';
const scores = { strong: 0, smart: 0 };

function saveScores(){
  try { localStorage.setItem(KEY, JSON.stringify(scores)); } catch(e){}
}
function loadScores(){
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (v && Number.isFinite(v.strong) && Number.isFinite(v.smart)){
      scores.strong = Math.max(0, v.strong | 0);
      scores.smart  = Math.max(0, v.smart  | 0);
    }
  } catch(e){}
}
function paintScores(bumped){
  $('pStrong').textContent = scores.strong;
  $('pSmart').textContent  = scores.smart;
  const lead = scores.strong === scores.smart ? null
             : scores.strong > scores.smart ? 'strong' : 'smart';
  $('strong').classList.toggle('lead', lead === 'strong');
  $('smart').classList.toggle('lead',  lead === 'smart');
  if (bumped){
    const el = $(bumped === 'strong' ? 'pStrong' : 'pSmart');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
}
function score(team, d){
  const next = scores[team] + d;
  if (next < 0) return;                 // no negative scores
  scores[team] = next;
  paintScores(d > 0 ? team : null);
  saveScores();
  if (d > 0) beep(team === 'strong' ? 880 : 660, .12, .17, 'triangle');
}
document.querySelectorAll('.plus, .minus').forEach(b =>
  b.onclick = () => score(b.dataset.t, +b.dataset.d));
$('zero').onclick = () => { scores.strong = 0; scores.smart = 0; paintScores(); saveScores(); };

loadScores();
paintScores();

reset();
requestAnimationFrame(frame);

// test hook
window.__t = { start, pause, reset, choose, score, scores,
               get remain(){ return remain; }, get running(){ return running; },
               get finished(){ return finished; },
               setRemain(s){ remain = s; if (running) endAt = Date.now() + s * 1000; } };
</script>
</body>
</html>
