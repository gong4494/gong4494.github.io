<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏞️ National Parks Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Nunito',sans-serif;color:#17351f;
  background:linear-gradient(170deg,#dff0e2 0%,#dfeef7 55%,#fdf6e3 100%);
  min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:clamp(1.3rem,4.6vw,2rem);font-weight:900;color:#1d5c34;text-align:center;}
.sub{text-align:center;color:#55745f;font-size:.85rem;margin:4px 0 12px;}

.bar{
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;
  margin-bottom:12px;
}
#search{
  flex:1 1 220px;max-width:340px;padding:10px 16px;border-radius:30px;
  border:2px solid #bcd9c6;font-family:inherit;font-size:.95rem;outline:none;
  background:#fff;color:#17351f;
}
#search:focus{border-color:#2e9e5b;}
.counter{
  background:#2e9e5b;color:#fff;border-radius:30px;padding:9px 20px;
  font-weight:900;font-size:.95rem;box-shadow:0 3px 0 #1c6b3c;
}
.mini{
  font-family:inherit;font-weight:800;cursor:pointer;border:none;border-radius:30px;
  padding:9px 16px;font-size:.82rem;background:#fff;color:#40684d;
  box-shadow:0 3px 0 #c9ddd0;
}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 #c9ddd0;}

.layout{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:880px){.layout{grid-template-columns:1fr 310px;align-items:start;}}

.mapcard{
  background:#fff;border-radius:20px;padding:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.07),0 10px 24px rgba(0,0,0,.08);
}
svg{display:block;width:100%;height:auto;}
.land{fill:#e8f3ea;stroke:#8fbfa0;stroke-width:1.6;stroke-linejoin:round;}
.lake{fill:#cfe6f5;stroke:#9fc8e0;stroke-width:1;}
.inset-box{fill:none;stroke:#c3d9ca;stroke-width:1.4;stroke-dasharray:5 4;}
.inset-label{font:700 11px Nunito,sans-serif;fill:#7d9a88;}

.pk{cursor:pointer;}
.pk circle{fill:#e4692a;stroke:#fff;stroke-width:1.6;transition:r .12s,fill .15s;}
.pk:hover circle{r:8;fill:#c2410c;}
.pk.seen circle{fill:#2e9e5b;}
.pk.sel circle{fill:#8e5ec9;stroke:#ffe066;stroke-width:3;}
.pk.dim{opacity:.17;pointer-events:none;}

.side{display:flex;flex-direction:column;gap:12px;}
.panel{
  background:#fff;border-radius:20px;padding:16px;
  box-shadow:0 6px 0 rgba(0,0,0,.07),0 10px 24px rgba(0,0,0,.08);
}
.panel h2{font-size:1.15rem;font-weight:900;color:#1d5c34;line-height:1.25;}
.meta{font-size:.8rem;color:#6b8a75;font-weight:800;margin:4px 0 9px;}
.desc{font-size:.9rem;line-height:1.6;color:#3d5a48;margin-bottom:12px;}
.seenbtn{
  width:100%;font-family:inherit;font-weight:900;cursor:pointer;border:none;
  border-radius:30px;padding:11px;font-size:.95rem;color:#fff;
  background:#2e9e5b;box-shadow:0 4px 0 #1c6b3c;
}
.seenbtn.off{background:#9fb3a6;box-shadow:0 4px 0 #6f8579;}
.seenbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1c6b3c;}
.empty{font-size:.9rem;color:#7d9a88;line-height:1.6;text-align:center;}

.legend{display:flex;gap:14px;justify-content:center;font-size:.76rem;color:#55745f;font-weight:800;padding-top:4px;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;}

.far{font-size:.8rem;color:#55745f;}
.far h3{font-size:.82rem;color:#1d5c34;margin-bottom:6px;}
.chip{
  display:inline-block;background:#f0f7f2;border:2px solid #d4e8db;border-radius:12px;
  padding:4px 10px;margin:3px 3px 0 0;font-size:.8rem;font-weight:800;
  color:#2d5f40;cursor:pointer;
}
.chip.seen{background:#2e9e5b;color:#fff;border-color:#1c6b3c;}

.tip{
  position:fixed;pointer-events:none;z-index:50;display:none;
  background:rgba(20,45,28,.94);color:#fff;border-radius:9px;
  padding:5px 10px;font-size:.8rem;font-weight:800;white-space:nowrap;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏞️ National Parks Map</h1>
  <div class="sub">All 63 U.S. National Parks · tap a dot to learn about it, and mark the ones you've been to</div>

  <div class="bar">
    <input id="search" type="text" placeholder="Search a park or state…" autocomplete="off">
    <div class="counter" id="counter">0 / 63 visited</div>
    <button class="mini" id="clear">Clear my list</button>
  </div>

  <div class="layout">
    <div class="mapcard">
      <svg id="map" viewBox="0 0 960 640" role="img" aria-label="Map of US national parks"></svg>
      <div class="legend">
        <span><i style="background:#e4692a"></i>Not yet</span>
        <span><i style="background:#2e9e5b"></i>Been there</span>
        <span><i style="background:#8e5ec9"></i>Selected</span>
      </div>
    </div>

    <div class="side">
      <div class="panel" id="info">
        <div class="empty">👆 Tap any dot on the map<br>to see the park.</div>
      </div>
      <div class="panel far">
        <h3>🌴 Way off the map</h3>
        <div id="far"></div>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
'use strict';

/* ── Projection ───────────────────────────────────────────────

const LON0 = -125, LON1 = -66.5, LAT0 = 49.6, LAT1 = 24.3;
const MAPW = 940, MAPH = Math.round(MAPW * (LAT0 - LAT1) / ((LON1 - LON0) * Math.cos(37 * Math.PI / 180)));
const OX = 10, OY = 8;
function proj(lat, lon){
  return [OX + (lon - LON0) / (LON1 - LON0) * MAPW,
          OY + (LAT0 - lat) / (LAT0 - LAT1) * MAPH];
}

// ── Build the SVG ───────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const pathOf = (pts, fn) => pts.map((p, i) => (i ? 'L' : 'M') + fn(p[0], p[1]).map(v => v.toFixed(1)).join(' ')).join('') + 'Z';

svg.appendChild(el('path', { d: pathOf(US, proj), class: 'land' }));
LAKES.forEach(l => svg.appendChild(el('path', { d: pathOf(l, proj), class: 'lake' })));

// Real islands, so their dots have land underneath instead of floating.
// [lat, lon, rx, ry, rotation]
[[48.05,-88.75,9,3,-38],   // Isle Royale, in Lake Superior
 [24.63,-82.87,2.6,2,0],   // Dry Tortugas, ~70mi west of Key West
 [34.02,-119.75,4,2,-8],   // Santa Cruz / Santa Rosa
 [33.95,-119.05,2.4,1.6,0],// Anacapa
 [33.25,-119.5,2.4,1.8,0], // San Nicolas area
].forEach(([la, lo, rx, ry, rot]) => {
  const [x, y] = proj(la, lo);
  svg.appendChild(el('ellipse', { cx: x, cy: y, rx, ry, class: 'land',
    transform: `rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})` }));
});

svg.appendChild(el('rect', { x: AK_BOX.x, y: AK_BOX.y, width: AK_BOX.w, height: AK_BOX.h, rx: 10, class: 'inset-box' }));
svg.appendChild(el('path', { d: pathOf(AK, projAK), class: 'land' }));
const akl = el('text', { x: AK_BOX.x + 10, y: AK_BOX.y + 18, class: 'inset-label' }); akl.textContent = 'ALASKA'; svg.appendChild(akl);

svg.appendChild(el('rect', { x: HI_BOX.x, y: HI_BOX.y, width: HI_BOX.w, height: HI_BOX.h, rx: 10, class: 'inset-box' }));
HI_ISLES.forEach(([la, lo, rx, ry]) => {
  const [x, y] = projHI(la, lo);
  svg.appendChild(el('ellipse', { cx: x, cy: y, rx, ry, class: 'land' }));
});
const hil = el('text', { x: HI_BOX.x + 10, y: HI_BOX.y + 18, class: 'inset-label' }); hil.textContent = "HAWAI'I"; svg.appendChild(hil);

const visited = new Set();
try { (JSON.parse(localStorage.getItem('parksVisited') || '[]') || []).forEach(n => visited.add(n)); } catch(e){}

const nodes = new Map();
PARKS.filter(p => !p.far).forEach(p => {
  const [x, y] = p.ak ? projAK(p.lat, p.lon) : p.hi ? projHI(p.lat, p.lon) : proj(p.lat, p.lon);
  const g = el('g', { class: 'pk' });
  g.appendChild(el('circle', { cx: x, cy: y, r: 6 }));
  g.addEventListener('click', () => select(p));
  g.addEventListener('mouseenter', e => showTip(e, p.n));
  g.addEventListener('mousemove', e => showTip(e, p.n));
  g.addEventListener('mouseleave', hideTip);
  svg.appendChild(g);
  nodes.set(p.n, g);
});

const tip = document.getElementById('tip');
function showTip(e, t){ tip.textContent = t; tip.style.display = 'block';
  tip.style.left = (e.clientX + 13) + 'px'; tip.style.top = (e.clientY - 8) + 'px'; }
function hideTip(){ tip.style.display = 'none'; }

// ── Selection / visited ─────────────────────────────────────
let sel = null;

function save(){ try { localStorage.setItem('parksVisited', JSON.stringify([...visited])); } catch(e){} }

function paint(){
  nodes.forEach((g, n) => {
    g.classList.toggle('seen', visited.has(n));
    g.classList.toggle('sel', !!sel && sel.n === n);
  });
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('seen', visited.has(c.dataset.n)));
  document.getElementById('counter').textContent = `${visited.size} / ${PARKS.length} visited`;
}

function select(p){
  sel = p;
  const been = visited.has(p.n);
  document.getElementById('info').innerHTML = `
    <h2>${p.n}</h2>
    <div class="meta">${p.s} · est. ${p.y}</div>
    <div class="desc">${p.d}</div>
    <button class="seenbtn ${been ? '' : 'off'}" id="toggle">
      ${been ? '✅ Been there!' : '○ Mark as visited'}
    </button>`;
  document.getElementById('toggle').onclick = () => {
    if (visited.has(p.n)) visited.delete(p.n); else visited.add(p.n);
    save(); select(p);
  };
  paint();
}

const farBox = document.getElementById('far');
PARKS.filter(p => p.far).forEach(p => {
  const c = document.createElement('span');
  c.className = 'chip'; c.textContent = p.n; c.dataset.n = p.n;
  c.onclick = () => select(p);
  farBox.appendChild(c);
});

// ── Search ──────────────────────────────────────────────────
document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  nodes.forEach((g, n) => {
    const p = PARKS.find(x => x.n === n);
    const hit = !q || n.toLowerCase().includes(q) || p.s.toLowerCase().includes(q);
    g.classList.toggle('dim', !hit);
  });
};

document.getElementById('clear').onclick = () => {
  if (!visited.size) return;
  visited.clear(); save(); if (sel) select(sel); else paint();
};

paint();
window.__p = { PARKS, proj, projAK, projHI, visited, select, nodes, MAPW, MAPH, OX, OY };
</script>
</body>
</html>
